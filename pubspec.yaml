name: sport_timer
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 2.0.0
  flutter_bloc: 9.1.1
  freezed: 4.0.1
  mockito: 5.8.1
  bloc_test: 10.0.0
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  intl: 0.20.3
  go_router: 18.1.1
  gap: 3.0.1
  injectable: 3.0.0
  get_it: 9.3.0
  audioplayers: 6.8.1
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  shared_preferences: 2.5.6

  basic_flutter_helper:
    git:
      url: https://github.com/alexaniko88/basic_flutter_helper.git
      ref: master
  lottie: 3.6.1
  collection: 1.19.1
  icons_launcher: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  build_runner: 2.16.1
  json_serializable: 6.15.2
  injectable_generator: 3.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/animation/
    - assets/icons/

icons_launcher:
  image_path: "assets/icons/app_icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true