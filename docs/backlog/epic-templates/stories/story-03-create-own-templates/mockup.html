<!doctype html>
<!--
  Planning topic: create your own templates (Templates story 3).
  Based on test/snapshots/goldens/templates_selected.png, templates_custom.png and setup_custom.png.
  Icons are drawn as emoji stand-ins; the app uses the Material icon named in each data-icon attribute.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own templates mockup</title>
<style>
  :root {
    --page-bg: #2a4f9a;
    --surface: #fff8f6;
    --app-bar: #ffb4a8;          /* colorScheme.inversePrimary (light bar) */
    --tile: #fceae7;             /* AppSurface fill */
    --tile-selected: #f6e3df;
    --outline-variant: #d8c2be;
    --primary: #904a42;
    --on-primary: #ffffff;
    --on-surface: #231918;
    --on-surface-variant: #534341;
    --error: #ba1a1a;
    --preparation: #e1ad01;
    --round: #ff5252;
    --rest: #448aff;
    --rounds-count: #ffab40;
    --scrim: rgba(0,0,0,.4);
    --r8: 8px; --r12: 12px; --r20: 20px;
  }
  [data-theme="dark"] {
    --surface: #1a1110;
    --app-bar: #271d1c;          /* colorScheme.surfaceContainer (dark bar) */
    --tile: #271d1c;
    --tile-selected: #322826;
    --outline-variant: #534341;
    --primary: #ffb4a8;
    --on-primary: #561e19;
    --on-surface: #f1dedc;
    --on-surface-variant: #d8c2be;
    --error: #ffb4ab;
    --preparation: #e8c23a;
    --round: #ff8a80;
    --rest: #82b1ff;
    --rounds-count: #ffb74d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); font-family: Roboto, system-ui, sans-serif; color: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 16px; }
  .controls select, .controls button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 0; }
  .frame { width: 390px; max-width: calc(100vw - 32px); height: 844px; margin: 0 auto 32px; position: relative;
    background: var(--surface); color: var(--on-surface); overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .bar { height: 56px; background: var(--app-bar); display: flex; align-items: center; padding: 0 4px; flex: none; }
  .bar h1 { font-size: 22px; font-weight: 400; margin: 0 0 0 12px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { width: 48px; height: 48px; border: 0; background: none; color: var(--on-surface); font-size: 22px; cursor: pointer; border-radius: 24px; }
  .body { flex: 1; overflow-y: auto; padding: 16px; }
  .tile { background: var(--tile); border: 1px solid var(--outline-variant); border-radius: var(--r12); padding: 12px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .tile.selected { border: 2px solid var(--primary); padding: 11px; background: var(--tile-selected); }
  .tile .ico { width: 24px; text-align: center; font-size: 20px; color: var(--primary); }
  .tile .txt { flex: 1; min-width: 0; }
  .tile .name { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .sum { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }
  .tile .total { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .tile .check { color: var(--primary); margin-right: 6px; }
  .section { font-size: 14px; font-weight: 500; color: var(--on-surface-variant); margin: 16px 4px 8px; }
  .field { display: block; }
  .field label { font-size: 12px; color: var(--primary); margin-left: 4px; }
  .field input { width: 100%; font: inherit; font-size: 16px; padding: 14px 12px; margin-top: 4px; border-radius: var(--r8);
    border: 1px solid var(--outline-variant); background: transparent; color: var(--on-surface); }
  .field.error input { border: 2px solid var(--error); padding: 13px 11px; }
  .field .help { font-size: 12px; margin: 4px 12px 0; color: var(--on-surface-variant); display: flex; justify-content: space-between; }
  .field.error .help .msg { color: var(--error); }
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .iconpick { height: 56px; border-radius: var(--r12); border: 1px solid var(--outline-variant); background: var(--tile);
    font-size: 22px; cursor: pointer; color: var(--primary); }
  .iconpick.selected { border: 2px solid var(--primary); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--tile); border: 1px solid var(--outline-variant); border-radius: var(--r12); height: 128px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
  .card .ci { font-size: 26px; }
  .card .cl { font-size: 15px; font-weight: 500; color: var(--on-surface-variant); }
  .card .cv { font-size: 24px; font-weight: 700; }
  .footer { padding: 16px; flex: none; }
  .footer .box { background: var(--tile); border: 1px solid var(--outline-variant); border-radius: var(--r12); padding: 12px 16px 16px; }
  .footer .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .footer .row b { font-size: 22px; }
  .btn { width: 100%; height: 52px; border-radius: var(--r12); border: 0; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    background: var(--primary); color: var(--on-primary); }
  .btn.secondary { background: transparent; color: var(--error); border: 1px solid var(--outline-variant); margin-top: 8px; font-size: 16px; height: 48px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; }
  .dialog { background: var(--surface); border-radius: var(--r20); padding: 24px; width: 312px; }
  .dialog h2 { margin: 0 0 12px; font-size: 22px; font-weight: 400; overflow-wrap: anywhere; }
  .dialog p { margin: 0 0 20px; color: var(--on-surface-variant); }
  .dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
  .dialog .acts button { font: inherit; font-weight: 500; background: none; border: 0; padding: 10px 12px; min-height: 48px; color: var(--primary); cursor: pointer; }
  .dialog .acts .danger { color: var(--error); }
  .snack { position: absolute; left: 16px; right: 16px; bottom: 16px; background: #322826; color: #f1dedc; border-radius: 4px; padding: 14px 16px; font-size: 14px; }
  .hint { color: #fff; text-align: center; font-size: 13px; padding: 0 16px 8px; opacity: .9; }
</style>
</head>
<body>
<div class="controls">
  <select id="state" aria-label="State"></select>
  <button id="theme">Dark theme</button>
  <button id="lang">Español</button>
</div>
<div class="hint" id="hint"></div>
<div class="frame" id="frame"></div>

<script>
const S = {
  en: {
    templatesTitle: 'Choose your template', add: 'New template', createTitle: 'New template', editTitle: 'Edit template',
    nameLabel: 'Name', nameEmpty: 'Enter a name', iconLabel: 'Icon', values: 'Timer', prep: 'Preparation', work: 'Work',
    rest: 'Rest', rounds: 'Rounds', session: 'Session length', save: 'Save', del: 'Delete template',
    delTitle: n => `Delete "${n}"?`, delBody: "This can't be undone.", cancel: 'Cancel', delete: 'Delete',
    saveError: "Couldn't save the template. Try again.", limit: 'You can save up to 20 templates.',
    back: 'Back', w: 'work', r: 'rest', rd: 'rounds', builtIn: ['Default', 'Full Abs', 'Hyrox', 'Stretching', 'Strength'],
    hint: 'Tap a template to apply it. Long-press an own template to edit it. "+" opens the create form.',
  },
  es: {
    templatesTitle: 'Elige tu plantilla', add: 'Nueva plantilla', createTitle: 'Nueva plantilla', editTitle: 'Editar plantilla',
    nameLabel: 'Nombre', nameEmpty: 'Escribe un nombre', iconLabel: 'Icono', values: 'Temporizador', prep: 'Preparación', work: 'Trabajo',
    rest: 'Descanso', rounds: 'Rondas', session: 'Duración de la sesión', save: 'Guardar', del: 'Eliminar plantilla',
    delTitle: n => `¿Eliminar «${n}»?`, delBody: 'No se puede deshacer.', cancel: 'Cancelar', delete: 'Eliminar',
    saveError: 'No se pudo guardar la plantilla. Inténtalo de nuevo.', limit: 'Puedes guardar hasta 20 plantillas.',
    back: 'Atrás', w: 'trabajo', r: 'descanso', rd: 'rondas', builtIn: ['Por defecto', 'Abdominales completos', 'Hyrox', 'Estiramientos', 'Fuerza'],
    hint: 'Toca una plantilla para aplicarla. Mantén pulsada una propia para editarla. "+" abre el formulario.',
  },
};
// Material icon name -> emoji stand-in.
const ICONS = [
  ['fitness_center', '🏋️'], ['directions_run', '🏃'], ['directions_bike', '🚴'], ['pool', '🏊'],
  ['sports_martial_arts', '🥋'], ['sports_gymnastics', '🤸'], ['self_improvement', '🧘'], ['timer', '⏱️'],
];
const BUILT_IN_ICONS = ['📋', '🤸', '🏃', '🧘', '🏋️'];
const BUILT_IN = [[20,60,30,12],[20,40,10,12],[20,300,60,8],[20,60,5,10],[20,90,30,8]];

let lang = 'en', theme = 'light';
let own = [{ name: 'Tabata', icon: 7, v: [10, 20, 10, 8] }];
let selected = 'own0';
let form = null;  // { mode, index, name, icon, v, error }
let dialog = false, snack = null;

const STATES = {
  'list': 'Templates list with one own template (selected)',
  'list-empty-own': 'Templates list, no own templates yet',
  'list-long': 'Own template with a long name',
  'create': 'Create form (prefilled from the current settings)',
  'create-error': 'Create form, empty name after Save',
  'edit': 'Edit form (long-press on own template)',
  'delete': 'Delete confirmation dialog',
  'save-error': 'Save failed (snackbar, form stays open)',
  'limit': '"+" with 20 own templates (snackbar)',
};
const sel = document.getElementById('state');
for (const [k, v] of Object.entries(STATES)) sel.add(new Option(v, k));

const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const short = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const total = v => v[0] + v[1]*v[3] + v[2]*(v[3]-1);
const human = s => { const m = Math.floor(s/60), r = s%60; return m ? `${m}m${r ? ' ' + r + 's' : ''}` : `${r}s`; };
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tile(key, icon, name, v, extra = '') {
  const t = S[lang], isSel = selected === key;
  return `<div class="tile ${isSel ? 'selected' : ''}" data-key="${key}" ${extra} role="button" tabindex="0">
    <span class="ico" aria-hidden="true">${icon}</span>
    <span class="txt"><div class="name">${esc(name)}</div>
    <div class="sum">${short(v[1])} ${t.w} · ${short(v[2])} ${t.r} · ${v[3]} ${t.rd}</div></span>
    ${isSel ? '<span class="check" aria-hidden="true">✔</span>' : ''}<span class="total">${human(total(v))}</span></div>`;
}

function renderList() {
  const t = S[lang];
  let h = `<div class="bar"><h1>← ${t.templatesTitle}</h1>
    <button class="iconbtn" id="add" aria-label="${t.add}" title="${t.add}">＋</button></div><div class="body">`;
  BUILT_IN.forEach((v, i) => h += tile('b' + i, BUILT_IN_ICONS[i], t.builtIn[i], v));
  own.forEach((o, i) => h += tile('own' + i, ICONS[o.icon][1], o.name, o.v, `data-own="${i}" aria-description="long-press to edit"`));
  return h + '</div>';
}

function renderForm() {
  const t = S[lang], f = form, v = f.v;
  let h = `<div class="bar"><button class="iconbtn" id="back" aria-label="${t.back}">←</button>
    <h1 style="margin-left:4px">${f.mode === 'edit' ? t.editTitle : t.createTitle}</h1>
    ${f.mode === 'edit' ? `<button class="iconbtn" id="del" data-icon="delete_outline" aria-label="${t.del}" title="${t.del}">🗑</button>` : ''}</div><div class="body">
    <div class="field ${f.error ? 'error' : ''}"><label for="nm">${t.nameLabel}</label>
      <input id="nm" maxlength="30" value="${esc(f.name)}">
      <div class="help"><span class="msg">${f.error ? t.nameEmpty : ''}</span><span>${f.name.length}/30</span></div></div>
    <div class="section">${t.iconLabel}</div><div class="icons" role="radiogroup" aria-label="${t.iconLabel}">`;
  ICONS.forEach(([n, e], i) => h += `<button class="iconpick ${i === f.icon ? 'selected' : ''}" data-icon="${n}" data-i="${i}" role="radio" aria-checked="${i === f.icon}" aria-label="${n}">${e}</button>`);
  h += `</div><div class="section">${t.values}</div><div class="grid">
    ${card('⏳', t.prep, mmss(v[0]), 'var(--preparation)')}${card('🏋', t.work, mmss(v[1]), 'var(--round)')}
    ${card('🧘', t.rest, mmss(v[2]), 'var(--rest)')}${card('🔁', t.rounds, v[3], 'var(--rounds-count)')}</div>
    </div><div class="footer"><div class="box"><div class="row"><span>${t.session}</span><b>${mmss(total(v))}</b></div>
    <button class="btn" id="save">${t.save}</button></div></div>`;
  return h;
}
const card = (i, l, v, c) => `<div class="card" role="button" tabindex="0"><span class="ci" style="color:${c}">${i}</span><span class="cl">${l}</span><span class="cv">${v}</span></div>`;

function render() {
  const t = S[lang], fr = document.getElementById('frame');
  fr.innerHTML = form ? renderForm() : renderList();
  if (dialog) fr.insertAdjacentHTML('beforeend', `<div class="scrim"><div class="dialog" role="dialog">
    <h2>${esc(t.delTitle(form.name))}</h2><p>${t.delBody}</p>
    <div class="acts"><button id="dc">${t.cancel}</button><button class="danger" id="dd">${t.delete}</button></div></div></div>`);
  if (snack) fr.insertAdjacentHTML('beforeend', `<div class="snack" role="status">${snack}</div>`);
  document.getElementById('hint').textContent = t.hint;
  wire();
}

function wire() {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('.tile').forEach(el => {
    let timer;
    el.onpointerdown = () => { timer = setTimeout(() => { timer = null; if (el.dataset.own) openEdit(+el.dataset.own); }, 500); };
    el.onpointerup = () => { if (timer) { clearTimeout(timer); selected = el.dataset.key; snack = null; render(); } };
    el.onpointerleave = () => clearTimeout(timer);
  });
  if ($('add')) $('add').onclick = () => {
    if (own.length >= 20) { snack = S[lang].limit; render(); return; }
    form = { mode: 'create', name: '', icon: 0, v: [10, 90, 15, 3], error: false }; snack = null; render();
  };
  if ($('back')) $('back').onclick = () => { form = null; snack = null; render(); };
  if ($('nm')) $('nm').oninput = e => { form.name = e.target.value; if (form.name.trim()) form.error = false;
    e.target.closest('.field').classList.toggle('error', form.error);
    e.target.closest('.field').querySelector('.help').lastElementChild.textContent = `${form.name.length}/30`; };
  document.querySelectorAll('.iconpick').forEach(b => b.onclick = () => { form.icon = +b.dataset.i; render(); });
  if ($('save')) $('save').onclick = () => {
    if (!form.name.trim()) { form.error = true; render(); return; }
    const item = { name: form.name.trim(), icon: form.icon, v: form.v };
    if (form.mode === 'edit') own[form.index] = item; else own.push(item);
    form = null; snack = null; render();
  };
  if ($('del')) $('del').onclick = () => { dialog = true; render(); };
  if ($('dc')) $('dc').onclick = () => { dialog = false; render(); };
  if ($('dd')) $('dd').onclick = () => { own.splice(form.index, 1); if (selected === 'own' + form.index) selected = null; dialog = false; form = null; render(); };
}
function openEdit(i) { const o = own[i]; form = { mode: 'edit', index: i, name: o.name, icon: o.icon, v: [...o.v], error: false }; snack = null; render(); }

function setState(k) {
  own = [{ name: 'Tabata', icon: 7, v: [10, 20, 10, 8] }]; selected = 'own0'; form = null; dialog = false; snack = null;
  if (k === 'list-empty-own') { own = []; selected = 'b2'; }
  if (k === 'list-long') own = [{ name: 'Morning kettlebell circuit', icon: 0, v: [15, 45, 15, 10] }];
  if (k === 'create') form = { mode: 'create', name: '', icon: 0, v: [10, 90, 15, 3], error: false };
  if (k === 'create-error') form = { mode: 'create', name: '', icon: 0, v: [10, 90, 15, 3], error: true };
  if (k === 'edit' || k === 'delete') openEditSilent(0);
  if (k === 'delete') dialog = true;
  if (k === 'save-error') { form = { mode: 'create', name: 'Tabata 2', icon: 7, v: [10, 20, 10, 8], error: false }; snack = S[lang].saveError; }
  if (k === 'limit') { own = Array.from({ length: 20 }, (_, i) => ({ name: 'Template ' + (i + 1), icon: i % 8, v: [10, 30, 10, 5] })); selected = null; snack = S[lang].limit; }
  render();
}
function openEditSilent(i) { const o = own[i]; form = { mode: 'edit', index: i, name: o.name, icon: o.icon, v: [...o.v], error: false }; }

sel.onchange = () => setState(sel.value);
document.getElementById('theme').onclick = e => {
  theme = theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = theme;
  e.target.textContent = theme === 'light' ? 'Dark theme' : 'Light theme';
};
document.getElementById('lang').onclick = e => { lang = lang === 'en' ? 'es' : 'en'; e.target.textContent = lang === 'en' ? 'Español' : 'English'; setState(sel.value); };
setState('list');
</script>
</body>
</html>
