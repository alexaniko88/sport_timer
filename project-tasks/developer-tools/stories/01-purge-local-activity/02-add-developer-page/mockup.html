<!--
  DEV-01-02 Add the developer page.
  Based on the goldens: home_drawer.png (drawer), templates_selected.png (page with app bar and AppSurface tiles),
  account_sign_out_dialog.png (confirmation dialog).
  English only: the developer page is debug-only and has no localization.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer Tools Mockup</title>
<style>
  :root {
    /* Approximations of ColorScheme.fromSeed(AppPalette.brand = #FF5252), light. */
    --primary: #904a43;
    --on-primary: #ffffff;
    --secondary-container: #ffdad5;
    --surface: #fff8f6;
    --surface-container-low: #fff0ee;
    --surface-container: #fceae7;
    --surface-container-high: #f6e4e1;
    --on-surface: #231918;
    --on-surface-variant: #534341;
    --outline-variant: #d8c2be;
    --error: #ba1a1a;
    --inverse-surface: #392e2c;
    --inverse-on-surface: #ffedea;
    --app-bar: #ffb4a9;
    --scrim: rgba(0, 0, 0, 0.32);
    --page: #2a56a5;
    --control-bg: #ffffff;
    --control-fg: #1b1b1b;
  }
  :root[data-theme="dark"] {
    --primary: #ffb4ab;
    --on-primary: #561e19;
    --secondary-container: #5d3f3b;
    --surface: #1a1110;
    --surface-container-low: #231918;
    --surface-container: #271d1c;
    --surface-container-high: #322827;
    --on-surface: #f1dfdc;
    --on-surface-variant: #d8c2be;
    --outline-variant: #534341;
    --error: #ffb4ab;
    --inverse-surface: #f1dfdc;
    --inverse-on-surface: #392e2c;
    --app-bar: #271d1c;
    --scrim: rgba(0, 0, 0, 0.6);
    --control-bg: #1f1f1f;
    --control-fg: #f1f1f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--page);
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px; }
  .controls button {
    min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #888;
    background: var(--control-bg); color: var(--control-fg); font-size: 14px; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { outline: 3px solid #ffd54f; }
  .phone {
    width: 390px; max-width: 100%; height: 844px; position: relative; overflow: hidden;
    background: var(--surface); color: var(--on-surface); box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* Home behind the drawer */
  .home-bar { height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 24px; background: var(--app-bar); font-size: 22px; }
  .home-body { flex: 1; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start; }
  .home-card { height: 170px; border-radius: 12px; border: 1px solid var(--outline-variant); background: var(--surface-container); }
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .drawer {
    position: absolute; top: 0; bottom: 0; left: 0; width: 304px; background: var(--surface-container-low);
    border-radius: 0 20px 20px 0; display: flex; flex-direction: column;
  }
  .drawer-title { padding: 24px 16px 16px 24px; font-size: 22px; }
  .drawer-list { flex: 1; padding: 0 12px; }
  .dest {
    height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    font-size: 14px; font-weight: 500; color: var(--on-surface-variant); cursor: pointer;
  }
  .dest.selected { background: var(--secondary-container); color: var(--on-surface); }
  .divider { height: 1px; background: var(--outline-variant); margin: 0 28px; }
  .drawer-footer { padding: 8px 12px 24px; }

  /* Developer page */
  .app-bar { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 4px; background: var(--app-bar); }
  .icon-btn { width: 48px; height: 48px; border: 0; background: none; color: var(--on-surface); border-radius: 24px; cursor: pointer; display: grid; place-items: center; }
  .app-bar h1 { margin: 0; font-size: 22px; font-weight: 400; }
  .page-body { padding: 16px; }
  .tile {
    width: 100%; min-height: 72px; display: flex; align-items: center; gap: 16px; padding: 12px; text-align: left;
    border-radius: 12px; border: 1px solid var(--outline-variant); background: var(--surface-container);
    color: var(--on-surface); font: inherit; cursor: pointer;
  }
  .tile[aria-disabled="true"] { cursor: default; opacity: .6; }
  .tile .icon { color: var(--primary); flex: none; }
  .tile-text { flex: 1; }
  .tile-title { font-size: 16px; font-weight: 700; }
  .tile-secondary { font-size: 12px; color: var(--on-surface-variant); margin-top: 4px; line-height: 1.35; }
  .trailing { width: 24px; height: 24px; flex: none; display: grid; place-items: center; color: var(--on-surface-variant); }
  .spinner { width: 20px; height: 20px; border: 2.5px solid var(--primary); border-right-color: transparent; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Dialog */
  .dialog-layer { position: absolute; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; }
  .dialog-layer.open { display: flex; }
  .dialog { width: 310px; border-radius: 20px; background: var(--surface-container-high); padding: 24px 24px 16px; }
  .dialog h2 { margin: 0 0 16px; font-size: 24px; font-weight: 400; }
  .dialog p { margin: 0 0 24px; font-size: 14px; line-height: 1.45; color: var(--on-surface-variant); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .text-btn { min-height: 48px; min-width: 64px; padding: 0 12px; border: 0; background: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--primary); }
  .text-btn.danger { color: var(--error); }

  /* Snackbar */
  .snackbar {
    position: absolute; left: 12px; right: 12px; bottom: 16px; min-height: 48px; border-radius: 4px;
    background: var(--inverse-surface); color: var(--inverse-on-surface); padding: 14px 16px; font-size: 14px;
    display: none; line-height: 1.35;
  }
  .snackbar.show { display: block; }
  svg { width: 24px; height: 24px; fill: currentColor; }
</style>
</head>
<body>
  <div class="controls" role="group" aria-label="State">
    <button data-state="drawer">Drawer</button>
    <button data-state="page">Page</button>
    <button data-state="dialog">Confirmation</button>
    <button data-state="deleting">Deleting</button>
    <button data-state="success">Success</button>
    <button data-state="failure">Failure</button>
  </div>
  <div class="controls" role="group" aria-label="Theme">
    <button data-theme="light">Light</button>
    <button data-theme="dark">Dark</button>
  </div>

  <div class="phone">
    <!-- Home with the drawer open -->
    <section class="screen" id="drawer-screen" aria-label="Home with drawer open">
      <div class="home-bar"><span>☰</span><span>Are you prepared?</span></div>
      <div class="home-body">
        <div class="home-card"></div><div class="home-card"></div>
        <div class="home-card"></div><div class="home-card"></div>
      </div>
      <div class="scrim"></div>
      <nav class="drawer" aria-label="Navigation drawer">
        <div class="drawer-title">Sport Timer</div>
        <div class="drawer-list">
          <div class="dest selected">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h14v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg>
            Templates
          </div>
          <div class="dest">
            <svg viewBox="0 0 24 24"><path d="M2.53 19.65l1.34.56v-9.03l-2.43 5.86c-.41 1.02.08 2.19 1.09 2.61zm19.5-3.7L17.07 3.98a2.01 2.01 0 0 0-1.81-1.23c-.26 0-.53.04-.79.15L7.1 5.95a2 2 0 0 0-1.08 2.6l4.96 11.97a2 2 0 0 0 2.6 1.08l7.36-3.05a2 2 0 0 0 1.09-2.6zM7.88 8.75c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-2 11c0 1.1.9 2 2 2h1.45l-3.45-8.34v6.34z"/></svg>
            Timer styles
          </div>
        </div>
        <div class="divider" role="separator"></div>
        <div class="drawer-footer">
          <div class="dest" role="button" tabindex="0" id="open-dev">
            <svg viewBox="0 0 24 24"><path d="M20 8h-2.81a5.985 5.985 0 0 0-1.82-1.96l.93-.93a.996.996 0 1 0-1.41-1.41l-1.47 1.47C12.96 5.06 12.49 5 12 5s-.96.06-1.41.17L9.11 3.7A.996.996 0 1 0 7.7 5.11l.92.93C7.88 6.55 7.26 7.22 6.81 8H4c-.55 0-1 .45-1 1s.45 1 1 1h2.09c-.05.33-.09.66-.09 1v1H4c-.55 0-1 .45-1 1s.45 1 1 1h2v1c0 .34.04.67.09 1H4c-.55 0-1 .45-1 1s.45 1 1 1h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20c.55 0 1-.45 1-1s-.45-1-1-1h-2.09c.05-.33.09-.66.09-1v-1h2c.55 0 1-.45 1-1s-.45-1-1-1h-2v-1c0-.34-.04-.67-.09-1H20c.55 0 1-.45 1-1s-.45-1-1-1zm-4 7c0 2.21-1.79 4-4 4s-4-1.79-4-4v-4c0-2.21 1.79-4 4-4s4 1.79 4 4v4zm-6-1h4v2h-4zm0-4h4v2h-4z"/></svg>
            Developer tools
          </div>
        </div>
      </nav>
    </section>

    <!-- Developer page -->
    <section class="screen" id="page-screen" aria-label="Developer tools page">
      <header class="app-bar">
        <button class="icon-btn" aria-label="Back" id="back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1>Developer tools</h1>
      </header>
      <div class="page-body">
        <button class="tile" id="purge-tile">
          <span class="icon">
            <svg viewBox="0 0 24 24"><path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zm2-8h6v8H5v-8zm5-6H6L5 5H2v2h12V5h-3z"/></svg>
          </span>
          <span class="tile-text">
            <span class="tile-title">Delete all activity</span>
            <span class="tile-secondary" style="display:block">Removes workouts and statistics for every account on this device. Settings and sign-in are kept.</span>
          </span>
          <span class="trailing" id="trailing">
            <svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </span>
        </button>
      </div>
      <div class="dialog-layer" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <div class="dialog">
          <h2 id="dialog-title">Delete all activity?</h2>
          <p>This deletes every workout and statistic for all accounts on this device. It can't be undone.</p>
          <div class="dialog-actions">
            <button class="text-btn" id="cancel">Cancel</button>
            <button class="text-btn danger" id="confirm">Delete</button>
          </div>
        </div>
      </div>
      <div class="snackbar" id="snackbar" role="status"></div>
    </section>
  </div>

<script>
  const root = document.documentElement;
  const screens = { drawer: 'drawer-screen', page: 'page-screen' };
  const chevron = document.getElementById('trailing').innerHTML;
  let state = 'drawer';

  function render() {
    const onPage = state !== 'drawer';
    document.getElementById(screens.drawer).classList.toggle('active', !onPage);
    document.getElementById(screens.page).classList.toggle('active', onPage);
    document.getElementById('dialog').classList.toggle('open', state === 'dialog');
    const deleting = state === 'deleting';
    const tile = document.getElementById('purge-tile');
    tile.setAttribute('aria-disabled', String(deleting));
    tile.setAttribute('aria-busy', String(deleting));
    document.getElementById('trailing').innerHTML = deleting ? '<span class="spinner" aria-label="Deleting"></span>' : chevron;
    const snack = document.getElementById('snackbar');
    snack.classList.toggle('show', state === 'success' || state === 'failure');
    snack.textContent = state === 'success'
      ? 'All local activity deleted.'
      : 'Could not delete activity: DatabaseException(database is locked)';
    document.querySelectorAll('[data-state]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.state === state)));
    const theme = root.getAttribute('data-theme') || 'light';
    document.querySelectorAll('[data-theme]').forEach(b => {
      if (b !== root) b.setAttribute('aria-pressed', String(b.dataset.theme === theme));
    });
  }
  function go(next) { state = next; render(); }

  document.querySelectorAll('[data-state]').forEach(b => b.addEventListener('click', () => go(b.dataset.state)));
  document.querySelectorAll('.controls [data-theme]').forEach(b => b.addEventListener('click', () => {
    root.setAttribute('data-theme', b.dataset.theme); render();
  }));
  document.getElementById('open-dev').addEventListener('click', () => go('page'));
  document.getElementById('back').addEventListener('click', () => go('drawer'));
  document.getElementById('purge-tile').addEventListener('click', () => { if (state !== 'deleting') go('dialog'); });
  document.getElementById('cancel').addEventListener('click', () => go('page'));
  document.getElementById('dialog').addEventListener('click', e => { if (e.target.id === 'dialog') go('page'); });
  document.getElementById('confirm').addEventListener('click', () => {
    go('deleting');
    setTimeout(() => go('success'), 1200);
  });
  root.setAttribute('data-theme', 'light');
  render();
</script>
</body>
</html>
